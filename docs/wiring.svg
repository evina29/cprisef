y2="110" stroke="#334155" stroke-width="2.5"/><text x="20" y="210" font-size="13" fill="#475569">signal path (3.3 v, interface board)</text><rect x="20" y="225" width="200" height="80" rx="6" fill="#e0f2fe" stroke="#334155" stroke-width="2"/><text x="120" y="263" text-anchor="middle" font-weight="bold">raspberry pi 5</text><text x="120" y="281" text-anchor="middle" font-size="12" fill="#475569">ai guidance software</text><rect x="330" y="225" width="240" height="80" rx="6" fill="#e0f2fe" stroke="#334155" stroke-width="2"/><text x="450" y="263" text-anchor="middle" font-weight="bold">interface board</text><text x="450" y="281" text-anchor="middle" font-size="12" fill="#475569">pico u1, 70 x 70 mm</text><rect x="680" y="205" width="260" height="60" rx="6" fill="#e0f2fe" stroke="#334155" stroke-width="2"/><text x="810" y="233" text-anchor="middle" font-weight="bold">hx711 + load cell</text><text x="810" y="251" text-anchor="middle" font-size="12" fill="#475569">j2: 3v3, gnd, dt gp27, sck gp26</text><rect x="680" y="285" width="260" height="60" rx="6" fill="#e0f2fe" stroke="#334155" stroke-width="2"/><text x="810" y="313" text-anchor="middle" font-weight="bold">buzzer and status led</text><text x="810" y="331" text-anchor="middle" font-size="12" fill="#475569">j4 gp18, j5 gp14</text><line x1="220" y1="265" x2="330" y2="265" stroke="#334155" stroke-width="2.5"/><text x="275" y="257" text-anchor="middle" font-size="12" fill="#334155">uart gp0 gp1</text><line x1="570" y1="245" x2="680" y2="235" stroke="#334155" stroke-width="2.5"/><line x1="570" y1="285" x2="680" y2="315" stroke="#334155" stroke-width="2.5"/><line x1="480" y1="145" x2="480" y2="225" stroke="#334155" stroke-width="2.5" stroke-dasharray="6 5"/><text x="480" y="190" text-anchor="middle" font-size="12" fill="#334155">e-stop sense j3: gp22</text><text x="20" y="400" font-size="12" fill="#475569">the interface board carries no motor current. the e-stop opens the motor path and also tells the pico so it can alert