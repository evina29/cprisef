<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Arial, Helvetica, sans-serif" font-size="14">
<rect width="720" height="300" fill="#fff"/>
<text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold">CPR Lifeline test rig: wiring (bench supply to DC motor)</text>
<rect x="50" y="90" width="190" height="130" rx="8" fill="#eef2f7" stroke="#333" stroke-width="2"/>
<text x="145" y="120" text-anchor="middle" font-weight="bold">bench DC power supply</text>
<text x="145" y="142" text-anchor="middle" font-size="12">set to motor rated voltage</text>
<text x="145" y="160" text-anchor="middle" font-size="12">current limit above load</text>
<circle cx="240" cy="130" r="7" fill="#222" stroke="#333"/><text x="205" y="135" font-size="16" font-weight="bold">-</text>
<circle cx="240" cy="180" r="7" fill="#d32f2f" stroke="#333"/><text x="205" y="186" font-size="16" font-weight="bold" fill="#d32f2f">+</text>
<path d="M247 130 H516" stroke="#222" stroke-width="3" fill="none"/>
<path d="M247 180 H330" stroke="#d32f2f" stroke-width="3" fill="none"/>
<rect x="330" y="165" width="70" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="365" y="185" text-anchor="middle" font-size="12">switch</text>
<path d="M400 180 H470 V150 H516" stroke="#d32f2f" stroke-width="3" fill="none"/>
<circle cx="560" cy="140" r="48" fill="#f4f4f4" stroke="#333" stroke-width="3"/>
<text x="560" y="150" text-anchor="middle" font-size="26" font-weight="bold">M</text>
<text x="560" y="214" text-anchor="middle" font-weight="bold">150 W DC motor</text>
<text x="560" y="232" text-anchor="middle" font-size="12">3000 RPM, shaft to 25:1 gearbox</text>
<text x="360" y="280" text-anchor="middle" font-size="12" fill="#555">Basic two-wire layout. No controller or PCB in this prototype. Switch is optional; voltage and fuse depend on the motor.</text>
</svg>
