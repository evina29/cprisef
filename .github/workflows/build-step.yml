name: Build STEP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python cpr_rig.py cpr_lifeline_rig.step
      - uses: actions/upload-artifact@v4
        with:
          name: cpr-lifeline-rig-cad
          path: |
            cpr_lifeline_rig.step
            *.stl
