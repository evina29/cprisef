name: build step

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python cprisef.py cprisef_rig.step
      - uses: actions/upload-artifact@v4
        with:
          name: cprisef-cad
          path: |
            cprisef_rig.step
            *.stl
